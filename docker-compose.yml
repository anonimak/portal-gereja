# ============================================================
# docker-compose.yml — PRODUCTION (T7)
# Self-contained: image berisi kode + vendor + public/build.
# Tidak ada bind-mount source (kode tidak bisa diedit dari host).
#
# Kompatibel dengan: podman compose / podman-compose / docker compose.
# Prasyarat (WAJIB):
#   make env     -> siapkan .env + generate secret (APP_KEY, DB_PASSWORD, root)
#   make up      -> build & jalankan semua service
# ============================================================
services:
  # ---------- Database (MariaDB) ----------
  db:
    image: docker.io/library/mariadb:10.11
    container_name: portal_db
    restart: unless-stopped
    command:
      - mysqld
      - --innodb-buffer-pool-size=128M
      - --max-connections=50
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-portal_gereja}
      MARIADB_USER: ${DB_USERNAME:-church_user}
      # Secret DIAMBIL dari .env (host) — TIDAK hardcode di file ini
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    volumes:
      - portal_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root -p$$MARIADB_ROOT_PASSWORD --silent || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - portal_network

  # ---------- Aplikasi PHP-FPM ----------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    image: portal-gereja:app
    container_name: portal_app
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-portal_gereja}
      DB_USERNAME: ${DB_USERNAME:-church_user}
      DB_PASSWORD: ${DB_PASSWORD}
      # Root password TIDAK diteruskan ke container aplikasi (hanya untuk service db)
      MARIADB_ROOT_PASSWORD: ""
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
      CACHE_STORE: ${CACHE_STORE:-database}
      SESSION_DRIVER: ${SESSION_DRIVER:-database}
      RUN_MIGRATIONS: "true"
    depends_on:
      - db
    volumes:
      - portal_storage:/var/www/html/storage
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit((@fsockopen(\"db\", 3306))?0:1);' && php-fpm -t >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - portal_network

  # ---------- Queue worker (QUEUE_CONNECTION=database) ----------
  queue:
    image: portal-gereja:app
    container_name: portal_queue
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-portal_gereja}
      DB_USERNAME: ${DB_USERNAME:-church_user}
      DB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ""
      RUN_MIGRATIONS: "false"
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]
    depends_on:
      - db
    volumes:
      - portal_storage:/var/www/html/storage
    networks:
      - portal_network

  # ---------- Scheduler (php artisan schedule:work) ----------
  scheduler:
    image: portal-gereja:app
    container_name: portal_scheduler
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-portal_gereja}
      DB_USERNAME: ${DB_USERNAME:-church_user}
      DB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ""
      RUN_MIGRATIONS: "false"
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      - db
    volumes:
      - portal_storage:/var/www/html/storage
    networks:
      - portal_network

  # ---------- Web Server (Nginx) ----------
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx
    image: portal-gereja:nginx
    container_name: portal_web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8000}:80"
    depends_on:
      - app
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/up >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 40s
    networks:
      - portal_network

networks:
  portal_network:
    driver: bridge

volumes:
  portal_db_data:    # persistensi database
  portal_storage:    # persistensi upload / storage runtime
