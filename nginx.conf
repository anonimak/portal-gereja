# ============================================================
# nginx.conf — PRODUCTION (T7) — hardening
# Dipakai oleh stage 'nginx' di Dockerfile (di-bake ke image).
# ============================================================

# Jangan tampilkan versi nginx di header/error page
server_tokens off;

# Timeout aman (cegah slowloris / gantung koneksi)
client_body_timeout 30s;
client_header_timeout 30s;
send_timeout 60s;
keepalive_timeout 65;
# Batas ukuran upload (Filament: foto anggota, dokumen, dll)
client_max_body_size 20m;

# Kompresi aset
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

server {
    listen 80;
    index index.php index.html;
    server_name _;

    root /var/www/html/public;

    # ---- Security headers dasar ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header X-XSS-Protection "0" always;
    # CSP sengaja TIDAK dipasang default (bisa memecah Livewire/Filament inline style).
    # Aktifkan bertahap setelah diuji, contoh minimal:
    # add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'self';" always;

    # Izinkan ACME challenge (.well-known) untuk HTTPS
    location ^~ /.well-known/ {
        allow all;
    }

    # Blokir akses file/direktori tersembunyi (.env, .git, dll)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Blokir file sensitif (defense-in-depth; root sebenarnya public/)
    location ~* \.(env|log|bak|sql|ini|sh|md|json|lock)$ {
        deny all;
    }

    # Cache aset hasil build Vite (/build/*) — immutable
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }
}
